<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Master - Labor 4.0</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: monospace;
    }
    #emergency-exit {
        position: fixed;
        top: 0;
        left: 0;
        width: 25%;
        height: 25%;
        z-index: 99999;
    }
    #debug-console {
        display: block;
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        bottom: 10px;
        box-sizing: border-box;
        background: #050505;
        color: #00ff00; /* Giftgrüner Matrix-Look für perfekte Lesbarkeit */
        font-family: monospace;
        font-size: 12px;
        line-height: 16px;
        padding: 15px;
        overflow-y: auto;
        border: 2px solid #111;
        z-index: 99999;
    }
</style>
</head>
<body>

<div id="emergency-exit"></div>

<div id="debug-console">
    ==================================================<br>
    🚀 SYSTEM-LABOR 4.0: RETRO-GEHÄRTET & ZÜNDBEREIT<br>
    ==================================================<br>
    [STATUS] Warte auf Phase 0: „zusammen“...
</div>

<script>
let phase = 0;
let kartenFarbe = "";
let kartenWert = 0;
let zuschauerName = "";
let geburtsTag = null;
let geburtsMonat = null;
let geburtsDatum = "";
let istGeburtstag = false;
let verarbeitetesResultat = 0;
let benutzerScrollt = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const consoleDiv = document.getElementById("debug-console");

consoleDiv.addEventListener('scroll', () => {
    if (consoleDiv.scrollHeight - consoleDiv.scrollTop > consoleDiv.clientHeight + 30) {
        benutzerScrollt = true;
    } else {
        benutzerScrollt = false;
    }
});

function logToConsole(text) {
    if (consoleDiv) {
        consoleDiv.innerHTML += "<br>" + text;
        if (!benutzerScrollt) {
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
    }
}

const deutscheZahlen = {
    "null": 0, "eins": 1, "ein": 1, "zwei": 2, "drei": 3, "vier": 4, "fünf": 5, "funf": 5, "sechs": 6, "sieben": 7, "acht": 8, "neun": 9,
    "zehn": 10, "elf": 11, "zwölf": 12, "zwolf": 12, "dreizehn": 13, "vierzehn": 14, "fünfzehn": 15, "funfzehn": 15, "sechzehn": 16, "siebzehn": 17, "achtzehn": 18, "neunzehn": 19,
    "zwanzig": 20, "einundzwanzig": 21, "zweiundzwanzig": 22, "dreiundzwanzig": 23, "vierundzwanzig": 24, "fünfundzwanzig": 25, "funfundzwanzig": 25, "sechsundzwanzig": 26, "siebenundzwanzig": 27, "achtundzwanzig": 28, "neunundzwanzig": 29,
    "dreißig": 30, "dreissig": 30, "einunddreißig": 31, "einunddreissig": 31
};

function findeZahlen(text) {
    let zahlen = [];
    let gesaeubert = text.replace(/\./g, " ");
    const mitZiffern = gesaeubert.match(/\d+/g);
    if (mitZiffern) {
        for (const zahl of mitZiffern) {
            const wert = parseInt(zahl, 10);
            if (!isNaN(wert)) { zahlen.push(wert); }
        }
    }
    const woerter = gesaeubert.toLowerCase().replace(/[.,!?;:]/g, " ").split(/\s+/).filter(Boolean);
    for (const wort of woerter) {
        if (Object.prototype.hasOwnProperty.call(deutscheZahlen, wort)) {
            zahlen.push(deutscheZahlen[wort]);
        }
    }
    return zahlen;
}
</script>
<script>
if (!SpeechRecognition) {
    logToConsole("❌ FEHLER: Dieser Browser unterstützt webkitSpeechRecognition nicht!");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = "de-DE";
    recognition.continuous = false; // UR-EINSTELLUNG: Garantiert den flüssigen Android-Wechselstrom
    recognition.interimResults = false;

    recognition.onstart = () => {};
    recognition.onaudiostart = () => {};
    recognition.onspeechstart = () => {};

    recognition.onerror = (event) => {
        logToConsole("⚠️ [API-STATUS] Ruhezustand detektiert (" + event.error + ")");
        if ((event.error === 'no-speech' || event.error === 'aborted') && phase < 4) {
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 250);
        }
    };

    recognition.onresult = (event) => {
        // DAS UNZERSTÖRBARE UR-SCHLEIFENGETRIEBE AUS IHREN ERFOLGREICHEN TESTS!
        for (let i = verarbeitetesResultat; i < event.results.length; i++) {
            const result = event.results[i];
            if (!result || !result[0]) { continue; }
            let roherText = result[0].transcript;
            if (!roherText) { continue; }
            roherText = roherText.toLowerCase().trim();
            verarbeitetesResultat = i + 1;

            /* =====================================================
               ✨ DAS HOCHGRADIG ABGEHÄRTETE BÜHLEN-BÜGEL-SKALPELL
               ===================================================== */
            let text = roherText
                .replace(/ein\s+mal/g, "einmal")
                .replace(/zwei\s+mal/g, "zweimal")
                .replace(/drei\s+mal/g, "dreimal")
                .replace(/vier\s+mal/g, "viermal")
                .replace(/fünf\s+mal/g, "viermal")
                .replace(/reihem\s+folge/g, "reihenfolge")
                .replace(/reihen\s+folge/g, "reihenfolge")
                .replace(/garten/g, "reihenfolge")       
                .replace(/kartendeckt/g, "reihenfolge")   
                .replace(/deckels/g, "reihenfolge")       
                .replace(/beachte/g, "14")                
                .replace(/achte/g, "8")                   
                .replace(/ranz/g, "franz")                
                .replace(/wolf/g, "12")                   
                .replace(/dein\s+datum/g, "dein datum");

            logToConsole("<br>📢 [GEHÖRT] „" + roherText + "“");
            if (roherText !== text) { logToConsole("✨ [GEBÜGELT] „" + text + "“"); }
            verarbeiteSprache(text);
        }
    };
    function verarbeiteSprache(text) {
        logToConsole("🔍 [ANALYSE] Prüfe Phase " + phase + "...");

        /* =====================================================
           🔓 PHASE 3: PRIORITY 1: DER ABSOLUTE BÜHNEN-NOT-AUSSTIEG
           ===================================================== */
        if (phase === 3) {
            if (text.includes("verdeckt") || text.includes("verdeck") || text.includes("fertig") || text.includes("ende") || text.includes("schluss")) {
                phase = 4;
                logToConsole("🎯 [TRIGGER] ABSCHLUSS-SIGNAL ERKANNT -> TRICK BEENDET");

                const heute = new Date();
                istGeburtstag = geburtsTag === heute.getDate() && geburtsMonat === (heute.getMonth() + 1);

                logToConsole("<br>================================================");
                logToConsole("🏆 FINAL-REPORT (IHRE NEUE TABELLEN-LOGIK)");
                logToConsole("================================================");
                logToConsole("🃏 KARTENFARBE: " + (kartenFarbe || "❌ (FEHLT!)"));
                logToConsole("🔢 BERECHNETER KARTENWERT: " + kartenWert);
                logToConsole("👤 NAME: " + (zuschauerName || "❌ (KEIN NAME)"));
                logToConsole("📅 DATUM: " + (geburtsDatum || "❌ (KEIN DATUM)"));
                logToConsole("🎂 GEBURTSTAG: " + (istGeburtstag ? "JA! 🎂🎈" : "NEIN"));
                logToConsole("================================================");
                recognition.stop();
                return;
            }
        }

        /* =====================================================
           🔓 PHASE 0 & 1: DRAMATISCHE PAUSE ERZWINGEN
           ===================================================== */
        if (phase === 0) {
            if (text.includes("zusammen")) {
                phase = 1;
                logToConsole("🔓 [PHASENWECHSEL] „zusammen“ erkannt -> Springe in PHASE 1");
                logToConsole("⏳ [INFO] Machen Sie jetzt Ihre dramatische Pause! Das Ohr startet frisch.");
            }
            return;
        }

        if (phase === 1) {
            if (text.includes("passiert")) { kartenFarbe = "Pik ♠"; phase = 2; }
            else if (text.includes("geschehen")) { kartenFarbe = "Herz ♥"; phase = 2; }
            else if (text.includes("gewesen")) { kartenFarbe = "Kreuz ♣"; phase = 2; }
            else if (text.includes("gehabt")) { kartenFarbe = "Karo ♦"; phase = 2; }

            if (kartenFarbe !== "") {
                logToConsole("🃏 [PHASENWECHSEL] Farbe gelockt: " + kartenFarbe + " -> Springe in PHASE 2");
            }
            return;
        }

        /* =====================================================
           🔓 PHASE 2: IHRE TABELLEN-MATRICES (ZAHLEN-AUSSCHLUSS!)
           ===================================================== */
        if (phase === 2) {
            if (text.includes("reihenfolge")) {
                
                let basis = 0;
                if (text.includes("händen") || text.includes("haenden")) {
                    basis = 9; 
                } else if (text.includes("hand")) {
                    basis = 4; 
                }

                let addition = 0;
                if (text.includes("einmal")) addition = 1;
                else if (text.includes("zweimal")) addition = 2;
                else if (text.includes("dreimal")) addition = 3;
                else if (text.includes("viermal")) addition = 4;

                kartenWert = basis + addition;

                if (basis === 4 && addition === 0) kartenWert = 5;
                if (basis === 9 && addition === 0) kartenWert = 11;
                
                if (basis === 0 && addition === 0) {
                    if (text.includes("viermal")) kartenWert = 4;
                    else if (text.includes("dreimal")) kartenWert = 3;
                    else if (text.includes("zweimal")) kartenWert = 2;
                    else if (text.includes("einmal")) kartenWert = 1;
                }

                logToConsole("🔒 [TABELLEN-MATCH] Wert unumstößlich eingeloggt: " + kartenWert + " -> Springe in PHASE 3");
                phase = 3;
                return;
            }
            return;
        }

        /* =====================================================
           🔓 PHASE 3: NAME + DATUM (ZAHLEN-ZULASSUNG NUR HIER!)
           ===================================================== */
        if (phase === 3) {
            const datumPosition = text.indexOf("dein datum");
            if (datumPosition > 0 && zuschauerName === "") {
                let nameTeil = text.substring(0, datumPosition).trim();
                nameTeil = nameTeil.replace(/^[,.:;!? ]+|[,.:;!? ]+\$/g, "");
                if (nameTeil.toLowerCase() !== "name" && nameTeil !== "") {
                    zuschauerName = nameTeil.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
                    logToConsole("👤 [PRODUKT] Name gesichert: " + zuschauerName);
                }
            }

            if (text.includes("heute") || text.includes("ist heute") || text.includes("ist also heute")) {
                if (geburtsTag === null) {
                    const echtzeitUhr = new Date();
                    geburtsTag = echtzeitUhr.getDate();
                    geburtsMonat = echtzeitUhr.getMonth() + 1;
                    geburtsDatum = String(geburtsTag).padStart(2, "0") + "." + String(geburtsMonat).padStart(2, "0");
                    logToConsole("📅 [PRODUKT] Trigger „heute“ erkannt! Kalenderdatum gelockt: " + geburtsDatum);
                }
            }

            const alsoPosition = text.indexOf("also");
            if (alsoPosition !== -1 && geburtsTag === null) {
                const nachAlso = text.substring(alsoPosition + 4).trim();
                const zahlen = findeZahlen(nachAlso);
                if (zahlen.length >= 2) {
                    geburtsTag = zahlen[0];
                    geburtsMonat = zahlen[1];
                    geburtsDatum = String(geburtsTag).padStart(2, "0") + "." + String(geburtsMonat).padStart(2, "0");
                    logToConsole("📅 [PRODUKT] Zahlen-Datum gesichert: " + geburtsDatum);
                }
            }
            return;
        }
    }

    /* GESTERNS REINER, UNZAPPLIGER WECHSELSTROM-RESTART */
    let neustartTimer = null;
    let antiLoopSperre = false;

    recognition.onend = () => {
        if (phase < 4) {
            if (antiLoopSperre) { return; }
            antiLoopSperre = true;
            if (neustartTimer) { clearTimeout(neustartTimer); }
            neustartTimer = setTimeout(() => {
                try {
                    // Der Zähler wird für die frische, saubere Sitzung genullt!
                    verarbeitetesResultat = 0; 
                    recognition.start();
                    setTimeout(() => { antiLoopSperre = false; }, 1000);
                } catch (e) { antiLoopSperre = false; }
            }, 800); 
        }
    };

    try { recognition.start(); } catch(e) {}
}

/* NOT-AUS (3 Sek oben links gedrückt halten zum Neuladen) */
let exitTimer = null;
document.getElementById("emergency-exit").addEventListener("touchstart", () => { exitTimer = setTimeout(() => { location.reload(); }, 3000); });
document.getElementById("emergency-exit").addEventListener("touchend", () => { clearTimeout(exitTimer); });
</script>
</body>
</html>

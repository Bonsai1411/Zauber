<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #000000;
            overflow: hidden; touch-action: none; user-select: none;
        }
        #emergency-exit { position: fixed; top: 0; left: 0; width: 20%; height: 20%; z-index: 9999; }
        
        /* Der magische Enthüllungs-Bildschirm */
        #reveal-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; color: white; font-family: 'Georgia', serif;
            text-align: center; justify-content: center; align-items: center; flex-direction: column;
            z-index: 5000;
        }
        #prediction-text { font-size: 24px; margin-bottom: 30px; padding: 20px; transition: opacity 2s; }
        #card-display { font-size: 40px; font-weight: bold; border: 3px solid white; padding: 40px 20px; border-radius: 10px; display: inline-block; min-width: 150px; opacity: 0; transition: opacity 2s; }
    </style>
</head>
<body>

    <div id="emergency-exit"></div>

    <div id="reveal-screen">
        <div id="prediction-text"></div>
        <div id="card-display"></div>
    </div>

<script>
    let phase = 0; 
    let kartenFarbe = "";
    let kartenWert = 0;
    let zuschauerName = "";
    let geburtsDatum = "";

    // ZWINGT DEN BROWSER IN DEN VOLLBILDMODUS BEI BERÜHRUNG
    document.documentElement.addEventListener('click', () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    });

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;
    recognition.interimResults = true; // Live-Erkennung im Millisekundentakt
    recognition.lang = 'de-DE';

    recognition.onresult = (event) => {
        let text = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            text += event.results[i].transcript;
        }
        text = text.toLowerCase();

        // PHASE 0: STARTAUSLÖSER (Sucht nach "nochmal zusammen")
        if (phase === 0 && text.indexOf("nochmal zusammen") !== -1) {
            phase = 1;
            
            // LAUTLOSER LICHTBLITZ (1 Blitz)
            document.body.style.backgroundColor = "#555555"; 
            setTimeout(() => { document.body.style.backgroundColor = "#000000"; }, 150);
            return;
        }

        // PHASE 1: KARTENFARBE ERKENNEN
        if (phase === 1) {
            let farbeGefunden = false;
            if (text.indexOf("passiert") !== -1) { kartenFarbe = "Pik ♠"; farbeGefunden = true; }
            else if (text.indexOf("geschehen") !== -1) { kartenFarbe = "Herz ♥"; farbeGefunden = true; }
            else if (text.indexOf("gewesen") !== -1) { kartenFarbe = "Kreuz ♣"; farbeGefunden = true; }
            else if (text.indexOf("gehabt") !== -1) { kartenFarbe = "Karo ♦"; farbeGefunden = true; }

            if (farbeGefunden) {
                phase = 2;
                // LAUTLOSES DOPPEL-BLITZEN
                document.body.style.backgroundColor = "#555555";
                setTimeout(() => { document.body.style.backgroundColor = "#000000"; setTimeout(() => { document.body.style.backgroundColor = "#555555"; setTimeout(() => { document.body.style.backgroundColor = "#000000"; }, 100); }, 100); }, 100);
                return;
            }
        }

        // PHASE 2: KARTENWERT RECHNEN
        if (phase === 2) {
            if (text.indexOf("einmal") !== -1) { kartenWert += 1; }
            if (text.indexOf("zweimal") !== -1) { kartenWert += 2; }
            if (text.indexOf("dreimal") !== -1) { kartenWert += 3; }
            if (text.indexOf("viermal") !== -1) { kartenWert += 4; }
            if (text.indexOf("hand") !== -1)   { kartenWert += 5; }
            if (text.indexOf("händen") !== -1) { kartenWert += 10; }

            if (text.indexOf("reihenfolge") !== -1) {
                phase = 3;
                // LAUTLOSES DREIFACH-BLITZEN
                let blitzCount = 0;
                let blitzInterval = setInterval(() => {
                    document.body.style.backgroundColor = document.body.style.backgroundColor === "rgb(0, 0, 0)" ? "#555555" : "#000000";
                    blitzCount++;
                    if (blitzCount >= 6) clearInterval(blitzInterval);
                }, 80);
            }
            return;
        }

        // PHASE 3: NAME & DATUM EXTRAHIEREN
        if (phase === 3 && text.indexOf("dein datum war der") !== -1) {
            const teile = text.split("dein datum war der");
            const worteVorher = teile[0].trim().split(" ");
            zuschauerName = worteVorher[worteVorher.length - 1]; 
            
            if (text.indexOf("also") !== -1) {
                const textNachWarDer = teile[1].trim();
                const datumsTeil = textNachWarDer.split("also")[0].trim();
                geburtsDatum = datumsTeil;
                
                recognition.stop(); 
                phase = 4; // Wartet auf Zuschauer
                
                // EIN LETZTER SCHWACHER LICHTBLITZ (Erkennung abgeschlossen)
                document.body.style.backgroundColor = "#222222";
                setTimeout(() => { document.body.style.backgroundColor = "#000000"; }, 100);
            }
            return;
        }
    };

    recognition.onend = () => { if (phase < 4) recognition.start(); };
    recognition.start();

    // DER STARTSCHUSS FÜR DEN ZUSCHAUER (Touch auf schwarzen Bildschirm)
    document.body.addEventListener('click', () => {
        if (phase === 4) {
            phase = 5;
            starteMagischeEnthuellung();
        }
    });

    function starteMagischeEnthuellung() {
        const screen = document.getElementById("reveal-screen");
        const textFeld = document.getElementById("prediction-text");
        const kartenFeld = document.getElementById("card-display");
        
        screen.style.display = "flex"; 

        // HEUTIGES DATUM FÜR GEBURTSTAGS-WEICHE ABGREIFEN
        const heute = new Date();
        const tagHeute = heute.getDate();
        const monatHeute = heute.getMonth() + 1;
        const datumHeuteString = (tagHeute < 10 ? "0" + tagHeute : tagHeute) + "." + (monatHeute < 10 ? "0" + monatHeute : monatHeute);

        const nameFormatiert = zuschauerName.charAt(0).toUpperCase() + zuschauerName.slice(1);

        let wertText = kartenWert;
        if (kartenWert === 1 || kartenWert === 14) wertText = "Ass";
        if (kartenWert === 11) wertText = "Bube";
        if (kartenWert === 12) wertText = "Dame";
        if (kartenWert === 13) wertText = "König";

        if (geburtsDatum.includes(datumHeuteString) || datumHeuteString.includes(geburtsDatum)) {
            textFeld.innerText = nameFormatiert + ", heute ist dein GEBURTSTAG! Du hättest an jedem Tag des Jahres hier sein können... aber das Schicksal wollte es genau heute.";
        } else {
            textFeld.innerText = nameFormatiert + ", du wirst als Datum den " + geburtsDatum + " nennen.";
        }

        setTimeout(() => {
            textFeld.style.opacity = "0";
            setTimeout(() => {
                textFeld.style.display = "none";
                kartenFeld.innerText = kartenFarbe + "\n" + wertText;
                kartenFeld.style.opacity = "1";
            }, 2000);
        }, 5000);
    }
</script>
</body>
</html>

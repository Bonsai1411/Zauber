<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystery Log</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; color: #000000;
            overflow: hidden; touch-action: none; user-select: none;
        }
        #emergency-exit { position: fixed; top: 0; left: 0; width: 20%; height: 20%; z-index: 9999; }
        #debug-trigger { position: fixed; top: 0; right: 0; width: 20%; height: 20%; z-index: 9999; }
        
        /* Das geheime Kontrollfenster (Standardmäßig unsichtbar) */
        #debug-console {
            display: none; position: fixed; bottom: 10px; left: 10px; right: 10px;
            height: 40%; background: #111; color: #888; font-family: monospace;
            font-size: 14px; padding: 10px; overflow-y: auto; border: 1px solid #333; z-index: 6000;
        }

        #reveal-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; color: white; font-family: 'Georgia', serif;
            text-align: center; justify-content: center; align-items: center; flex-direction: column;
            z-index: 5000;
        }
        #prediction-text { font-size: 24px; margin-bottom: 30px; padding: 20px; transition: opacity 2s; }
        #card-display { font-size: 40px; font-weight: bold; border: 3px solid white; padding: 40px 20px; border-radius: 10px; display: inline-block; min-width: 150px; opacity: 0; transition: opacity 2s; }
    </style>
</head>
<body>

    <!-- Touch-Zonen -->
    <div id="emergency-exit"></div>
    <div id="debug-trigger"></div>

    <!-- Das geheime Kontrollfenster -->
    <div id="debug-console">--- KONTROLLFENSTER BEREIT ---<br>Warte auf Sprache...</div>

    <div id="reveal-screen">
        <div id="prediction-text"></div>
        <div id="card-display"></div>
    </div>

<script>
    let phase = 0; 
    let kartenFarbe = "";
    let kartenWert = 0;
    let zuschauerName = "";
    let geburtsDatum = "";

    const consoleDiv = document.getElementById("debug-console");

    function logToConsole(msg) {
        consoleDiv.innerHTML += "<br>" + msg;
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // GEHEIMER AUSLÖSER FÜR DAS KONTROLLFENSTER (Oben rechts 2 Sekunden halten)
    let debugTimer;
    document.getElementById('debug-trigger').addEventListener('touchstart', () => {
        debugTimer = setTimeout(() => {
            consoleDiv.style.display = consoleDiv.style.display === "block" ? "none" : "block";
            logToConsole("--- MANUELLER LOG-AUFRUF ---");
            logToConsole("Aktuelle Phase: " + phase);
            logToConsole("Eingeloggte Farbe: " + kartenFarbe);
            logToConsole("Aktueller Wert: " + kartenWert);
        }, 2000);
    });
    document.getElementById('debug-trigger').addEventListener('touchend', () => { clearTimeout(debugTimer); });

    // VOLLBILD ERZWINGEN BEIM ERSTEN TIPPEN
    document.documentElement.addEventListener('click', () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    });

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;
    recognition.interimResults = true; 
    recognition.lang = 'de-DE';

 recognition.onresult = (event) => {
        // Die modernste Formel, um den Text fehlerfrei aus Android auszulesen:
        const resultIndex = event.resultIndex;
        const transcript = event.results[resultIndex][0].transcript;
        let text = transcript.toLowerCase().trim();

        // Zeige im Kontrollfenster LIVE an, was das Handy hört
        consoleDiv.innerHTML = "<b>Gehört:</b> " + text + "<br><b>Phase:</b> " + phase + " | <b>Farbe:</b> " + kartenFarbe + " | <b>Wert:</b> " + kartenWert;

        // PHASE 0: STARTAUSLÖSER
        if (phase === 0 && (text.includes("nochmal zusammen") || text.includes("noch mal zusammen") || text.includes("zusammen"))) {
            phase = 1;
            logToConsole("-> STARTAUSLÖSER ERKANNT! Schalte auf Phase 1.");
            
            document.body.style.backgroundColor = "#555555"; 
            setTimeout(() => { document.body.style.backgroundColor = "#000000"; }, 150);
            return;
        }

        // PHASE 1: KARTENFARBE
        if (phase === 1) {
            let farbeGefunden = false;
            if (text.includes("passiert")) { kartenFarbe = "Pik ♠"; farbeGefunden = true; }
            else if (text.includes("geschehen")) { kartenFarbe = "Herz ♥"; farbeGefunden = true; }
            else if (text.includes("gewesen")) { kartenFarbe = "Kreuz ♣"; farbeGefunden = true; }
            else if (text.includes("gehabt")) { kartenFarbe = "Karo ♦"; farbeGefunden = true; }

            if (farbeGefunden) {
                phase = 2;
                logToConsole("-> FARBE ERKANNT: " + kartenFarbe + ". Schalte auf Phase 2.");
                
                document.body.style.backgroundColor = "#555555";
                setTimeout(() => { document.body.style.backgroundColor = "#000000"; setTimeout(() => { document.body.style.backgroundColor = "#555555"; setTimeout(() => { document.body.style.backgroundColor = "#000000"; }, 100); }, 100); }, 100);
                return;
            }
        }

// PHASE 2: WERT RECHNEN (Maßgeschneidert für Ihre Performance)
        if (phase === 2) {
            let jetzt = Date.now();

            // Zahlenwörter behalten die 2-Sekunden-Sperre für Mehrfachnutzung
            if (text.includes("einmal") && (jetzt - sperreWorte.einmal > 2000)) { kartenWert += 1; logToConsole("+1 (einmal)"); sperreWorte.einmal = jetzt; }
            if (text.includes("zweimal") && (jetzt - sperreWorte.zweimal > 2000)) { kartenWert += 2; logToConsole("+2 (zweimal)"); sperreWorte.zweimal = jetzt; }
            if (text.includes("dreimal") && (jetzt - sperreWorte.dreimal > 2000)) { kartenWert += 3; logToConsole("+3 (dreimal)"); sperreWorte.dreimal = jetzt; }
            if (text.includes("viermal") && (jetzt - sperreWorte.viermal > 2000)) { kartenWert += 4; logToConsole("+4 (viermal)"); sperreWorte.viermal = jetzt; }
            
            // "Hand" und "Händen" werden nach EINMALIGER Nutzung komplett eingefroren
            if (text.includes("hand") && !text.includes("verarbeitet_hand"))   { kartenWert += 5; logToConsole("+5 (hand)"); text += " verarbeitet_hand"; }
            if (text.includes("händen") && !text.includes("verarbeitet_haenden")) { kartenWert += 10; logToConsole("+10 (händen)"); text += " verarbeitet_haenden"; }

            if (text.includes("reihenfolge")) {
                phase = 3;
                logToConsole("-> WERT BEENDET. Gesamtwert: " + kartenWert + ". Schalte auf Phase 3.");
                
                let blitzCount = 0;
                let blitzInterval = setInterval(() => {
                    document.body.style.backgroundColor = document.body.style.backgroundColor === "rgb(0, 0, 0)" ? "#555555" : "#000000";
                    blitzCount++;
                    if (blitzCount >= 6) clearInterval(blitzInterval);
                }, 80);
            }
            return;
        }

        // PHASE 3: NAME & DATUM
        if (phase === 3 && text.includes("dein datum war der")) {
            try {
                const vorDein = text.split("dein datum war der")[0].trim();
                const nameListe = vorDein.split(" ");
                zuschauerName = nameListe[nameListe.length - 1];
            } catch(e) { zuschauerName = "Zuschauer"; }
            
            if (text.includes("also")) {
                try {
                    const nachWarDer = text.split("dein datum war der")[1];
                    geburtsDatum = nachWarDer.split("also")[0].trim();
                } catch(e) { geburtsDatum = "heute"; }
                
                logToConsole("-> FINALE: Name=" + zuschauerName + " | Datum=" + geburtsDatum);
                recognition.stop(); 
                phase = 4;
            }
            return;
        }
    };

    recognition.onend = () => { if (phase < 4) recognition.start(); };
    recognition.start();

    document.body.addEventListener('click', () => {
        if (phase === 4) {
            phase = 5;
            consoleDiv.style.display = "none"; // Schließt das Log vor der Show
            starteMagischeEnthuellung();
        }
    });

    function starteMagischeEnthuellung() {
        const screen = document.getElementById("reveal-screen");
        const textFeld = document.getElementById("prediction-text");
        const kartenFeld = document.getElementById("card-display");
        
        screen.style.display = "flex"; 

        const heute = new Date();
        const tagHeute = heute.getDate();
        const monatHeute = heute.getMonth() + 1;
        const datumHeuteString = (tagHeute < 10 ? "0" + tagHeute : tagHeute) + "." + (monatHeute < 10 ? "0" + monatHeute : monatHeute);

        const nameFormatiert = zuschauerName.charAt(0).toUpperCase() + zuschauerName.slice(1);

        let wertText = kartenWert;
        if (kartenWert === 1 || kartenWert === 14) wertText = "Ass";
        if (kartenWert === 11) wertText = "Bube";
        if (kartenWert === 12) wertText = "Dame";
        if (kartenWert === 13) wertText = "König";

        if (geburtsDatum.includes(datumHeuteString) || datumHeuteString.includes(geburtsDatum)) {
            textFeld.innerText = nameFormatiert + ", heute ist dein GEBURTSTAG! Du hättest an jedem Tag des Jahres hier sein können... aber das Schicksal wollte es genau heute.";
        } else {
            textFeld.innerText = nameFormatiert + ", du wirst als Datum den " + geburtsDatum + " nennen.";
        }

        setTimeout(() => {
            textFeld.style.opacity = "0";
            setTimeout(() => {
                textFeld.style.display = "none";
                kartenFeld.innerText = kartenFarbe + "\n" + wertText;
                kartenFeld.style.opacity = "1";
            }, 2000);
        }, 5000);
    }
</script>
</body>
</html>

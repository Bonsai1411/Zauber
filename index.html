<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mystery Master</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: monospace;
    }

    /* Unsichtbare Bereiche für spätere Bedienung */
    #emergency-exit {
        position: fixed;
        top: 0;
        left: 0;
        width: 25%;
        height: 25%;
        z-index: 99999;
    }

    #debug-trigger {
        position: fixed;
        top: 0;
        right: 0;
        width: 25%;
        height: 25%;
        z-index: 99999;
        background: transparent;
    }

    /* Kontrollfenster */
    #debug-console {
        display: block;
        position: fixed;
        bottom: 10px;
        left: 10px;
        right: 10px;
        height: 55%;
        box-sizing: border-box;

        background: #0a0a0a;
        color: #444;

        font-family: monospace;
        font-size: 13px;

        padding: 10px;
        overflow-y: auto;

        border: 1px solid #1a1a1a;
        z-index: 99999;
    }

    /* Tarnkappe */
    #tarnkappe {
        position: fixed;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background-color: #000;
        opacity: 0.995;

        pointer-events: none;
        z-index: 88888;
    }
</style>
</head>

<body>

<div id="emergency-exit"></div>
<div id="debug-trigger"></div>

<div id="tarnkappe"></div>

<div id="debug-console">
    --- DIGITALE DIMMUNG AKTIV ---<br>
    Warte auf „Zusammen“...
</div>


<script>

/* =========================================================
   GRUNDZUSTAND
   ========================================================= */

let phase = 0;

/*
PHASE 0
Warten auf „Zusammen“

PHASE 1
Kartenfarbe suchen

PHASE 2
Codewörter zählen

PHASE 3
Name + Datum

PHASE 4
Alles fertig / Sprachaufnahme beendet
*/


/* =========================================================
   GESPEICHERTE TRICKDATEN
   ========================================================= */

let kartenFarbe = "";
let kartenWert = 0;

let zuschauerName = "";

let geburtsTag = null;
let geburtsMonat = null;

let geburtsDatum = "";

let istGeburtstag = false;


/* =========================================================
   SPERRSYSTEM
   Verhindert doppelte Verarbeitung
   ========================================================= */

let verarbeitetesResultat = 0;


/* =========================================================
   CODEWÖRTER
   ========================================================= */

const codeWorte = {
    einmal: 1,
    zweimal: 2,
    dreimal: 3,
    viermal: 4,
    hand: 5,
    händen: 10
};


/* =========================================================
   DEBUG-CONSOLE
   ========================================================= */

const consoleDiv =
    document.getElementById("debug-console");


function logToConsole(text) {

    consoleDiv.innerHTML +=
        "<br>" + text;

    consoleDiv.scrollTop =
        consoleDiv.scrollHeight;
}


/* =========================================================
   DEBUG AN / AUS
   ========================================================= */

document
    .getElementById("debug-trigger")
    .addEventListener("touchstart", (event) => {

        event.preventDefault();

        if (consoleDiv.style.display === "none") {

            consoleDiv.style.display = "block";

        } else {

            consoleDiv.style.display = "none";
        }
    });


/* =========================================================
   SPEECH RECOGNITION
   ========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    logToConsole(
        "❌ FEHLER: Dieser Browser unterstützt SpeechRecognition nicht."
    );

} else {

    const recognition =
        new SpeechRecognition();


    recognition.lang = "de-DE";

    /*
    Wir lassen den Browser möglichst lange zuhören.
    Falls er trotzdem beendet, starten wir kontrolliert neu.
    */

    recognition.continuous = true;

    /*
    Für die eigentliche Verarbeitung brauchen wir
    zunächst nur fertige Ergebnisse.
    */

    recognition.interimResults = false;


    /* =====================================================
       START
       ===================================================== */

    recognition.onstart = () => {

        logToConsole(
            "🎤 SPRACHERKENNUNG GESTARTET"
        );
    };


    /* =====================================================
       AUDIO
       ===================================================== */

    recognition.onaudiostart = () => {

        logToConsole(
            "🎧 MIKROFON / AUDIO AKTIV"
        );
    };


    /* =====================================================
       SPRACHE ERKANNT
       ===================================================== */

    recognition.onspeechstart = () => {

        logToConsole(
            "🗣️ SPRACHE ERKANNT"
        );
    };


    /* =====================================================
       FEHLER
       ===================================================== */

    recognition.onerror = (event) => {

        logToConsole(
            "❌ SPRACHFEHLER: " +
            event.error
        );
    };


    /* =====================================================
       HAUPTVERARBEITUNG
       ===================================================== */

    recognition.onresult = (event) => {


        /*
        Wir verarbeiten nur neue Ergebnisse.

        NICHT jedes Mal event.results[0],
        event.results[1] usw. erneut.
        */

        for (
            let i = verarbeitetesResultat;
            i < event.results.length;
            i++
        ) {

            const result =
                event.results[i];


            if (!result || !result[0]) {
                continue;
            }


            let text =
                result[0].transcript
                    .toLowerCase()
                    .trim();


            if (!text) {
                continue;
            }


            verarbeitetesResultat =
                i + 1;


            logToConsole(
                "📝 GEHÖRT: „" +
                text +
                "“"
            );


            verarbeiteSprache(text);
        }
    };


    /* =====================================================
       SPRACHVERARBEITUNG
       ===================================================== */

    function verarbeiteSprache(text) {


        /* =================================================
           PHASE 0
           START DURCH „ZUSAMMEN“
           ================================================= */

        if (phase === 0) {

            if (text.includes("zusammen")) {

                phase = 1;

                logToConsole(
                    "▶️ „ZUSAMMEN“ ERKANNT"
                );

                logToConsole(
                    "PHASE 1: SUCHE KARTENFARBE"
                );

            }

            return;
        }


        /* =================================================
           PHASE 1
           KARTENFARBE
           ================================================= */

        if (phase === 1) {


            if (text.includes("passiert")) {

                kartenFarbe = "Pik ♠";

            }

            else if (text.includes("geschehen")) {

                kartenFarbe = "Herz ♥";

            }

            else if (text.includes("gewesen")) {

                kartenFarbe = "Kreuz ♣";

            }

            else if (text.includes("gehabt")) {

                kartenFarbe = "Karo ♦";
            }


            if (kartenFarbe !== "") {

                phase = 2;

                logToConsole(
                    "🃏 KARTENFARBE: " +
                    kartenFarbe
                );

                logToConsole(
                    "PHASE 2: CODEWÖRTER ZÄHLEN"
                );
            }


            return;
        }


        /* =================================================
           PHASE 2
           KARTENWERT
           ================================================= */

        if (phase === 2) {


            /*
            Reihenfolge beendet die Berechnung.
            */

            if (text.includes("reihenfolge")) {

                phase = 3;

                logToConsole(
                    "🔒 „REIHENFOLGE“ ERKANNT"
                );

                logToConsole(
                    "KARTENWERT FESTGESETZT: " +
                    kartenWert
                );

                logToConsole(
                    "PHASE 3: NAME / DATUM"
                );

                return;
            }


            /*
            Codewörter.
            */

            let wertGefunden = false;


            /*
            Längere Wörter zuerst.
            Damit „händen“ nicht versehentlich
            nur als „hand“ interpretiert wird.
            */

            if (text.includes("händen")) {

                kartenWert += 10;

                wertGefunden = true;

                logToConsole(
                    "➕ HÄNDEN = +10"
                );
            }

            else if (text.includes("viermal")) {

                kartenWert += 4;

                wertGefunden = true;

                logToConsole(
                    "➕ VIERMAL = +4"
                );
            }

            else if (text.includes("dreimal")) {

                kartenWert += 3;

                wertGefunden = true;

                logToConsole(
                    "➕ DREIMAL = +3"
                );
            }

            else if (text.includes("zweimal")) {

                kartenWert += 2;

                wertGefunden = true;

                logToConsole(
                    "➕ ZWEIMAL = +2"
                );
            }

            else if (text.includes("einmal")) {

                kartenWert += 1;

                wertGefunden = true;

                logToConsole(
                    "➕ EINMAL = +1"
                );
            }

            else if (text.includes("hand")) {

                kartenWert += 5;

                wertGefunden = true;

                logToConsole(
                    "➕ HAND = +5"
                );
            }


            if (wertGefunden) {

                logToConsole(
                    "AKTUELLER KARTENWERT: " +
                    kartenWert
                );
            }


            return;
        }


        /* =================================================
           PHASE 3
           NAME + DATUM
           ================================================= */

        if (phase === 3) {


            /* =============================================
               NAME
               ============================================= */

            /*
            Wir suchen „dein datum“.

            Alles davor kann der Name sein.
            */

            const datumPosition =
                text.indexOf("dein datum");


            if (
                datumPosition > 0 &&
                zuschauerName === ""
            ) {

                let nameTeil =
                    text
                        .substring(
                            0,
                            datumPosition
                        )
                        .trim();


                /*
                Satzzeichen entfernen.
                */

                nameTeil =
                    nameTeil.replace(
                        /^[,.:;!? ]+|[,.:;!? ]+$/g,
                        ""
                    );


                /*
                Falls der Satz z.B.
                „Name, dein Datum...“
                lautet, entfernen wir „Name“.
                */

                if (
                    nameTeil.toLowerCase() === "name"
                ) {

                    nameTeil = "";
                }


                if (nameTeil !== "") {

                    zuschauerName =
                        nameTeil
                            .split(/\s+/)
                            .map(wort =>
                                wort.charAt(0).toUpperCase() +
                                wort.slice(1)
                            )
                            .join(" ");


                    logToConsole(
                        "👤 NAME: " +
                        zuschauerName
                    );
                }

            }


            /* =============================================
               DATUM
               ============================================= */

            /*
            Wir suchen „also“.

            Die ersten beiden Zahlen danach
            sind Tag und Monat.
            */

            const alsoPosition =
                text.indexOf("also");


            if (alsoPosition !== -1) {

                const nachAlso =
                    text.substring(
                        alsoPosition + 4
                    );


                /*
                Zahlen aus dem Bereich nach „also“
                herauslesen.
                */

                const zahlen =
                    nachAlso.match(/\d+/g);


                if (
                    zahlen &&
                    zahlen.length >= 2
                ) {

                    geburtsTag =
                        parseInt(
                            zahlen[0],
                            10
                        );

                    geburtsMonat =
                        parseInt(
                            zahlen[1],
                            10
                        );


                    if (
                        geburtsTag >= 1 &&
                        geburtsTag <= 31 &&
                        geburtsMonat >= 1 &&
                        geburtsMonat <= 12
                    ) {

                        geburtsDatum =
                            String(geburtsTag)
                                .padStart(2, "0") +
                            "." +
                            String(geburtsMonat)
                                .padStart(2, "0");


                        logToConsole(
                            "📅 DATUM: " +
                            geburtsDatum
                        );

                    } else {

                        logToConsole(
                            "⚠️ DATUM UNGÜLTIG"
                        );
                    }
                }
            }


            /* =============================================
               VERDECKT = SPRACHE BEENDET
               ============================================= */

            if (text.includes("verdeckt")) {

                phase = 4;

                logToConsole(
                    "🛑 „VERDECKT“ ERKANNT"
                );

                logToConsole(
                    "🎤 SPRACHERKENNUNG WIRD BEENDET"
                );


                /*
                Geburtstag feststellen.
                */

                const heute =
                    new Date();


                const heuteTag =
                    heute.getDate();


                const heuteMonat =
                    heute.getMonth() + 1;


                istGeburtstag =
                    geburtsTag === heuteTag &&
                    geburtsMonat === heuteMonat;


                logToConsole(
                    "--------------------------------"
                );

                logToConsole(
                    "ERGEBNIS"
                );

                logToConsole(
                    "FARBE: " +
                    kartenFarbe
                );

                logToConsole(
                    "WERT: " +
                    kartenWert
                );

                logToConsole(
                    "NAME: " +
                    (
                        zuschauerName ||
                        "(kein Name erkannt)"
                    )
                );

                logToConsole(
                    "DATUM: " +
                    (
                        geburtsDatum ||
                        "(kein Datum erkannt)"
                    )
                );

                logToConsole(
                    "GEBURTSTAG: " +
                    (
                        istGeburtstag
                            ? "JA 🎂"
                            : "NEIN"
                    )
                );

                logToConsole(
                    "--------------------------------"
                );


                /*
                Hier ist später der Übergang
                zur eigentlichen Reveal-Animation.
                */

                recognition.stop();

                return;
            }

            return;
        }
    }


    /* =====================================================
       ENDE DER ERKENNUNG
       ===================================================== */

    recognition.onend = () => {

        logToConsole(
            "⏹️ SPRACHERKENNUNG BEENDET"
        );


        /*
        Wenn der Trick noch nicht abgeschlossen ist,
        starten wir kontrolliert neu.

        Nach „verdeckt“ bleibt sie aus.
        */

        if (phase < 4) {

            setTimeout(() => {

                try {

                    recognition.start();

                } catch (e) {

                    logToConsole(
                        "❌ NEUSTARTFEHLER: " +
                        e.message
                    );
                }

            }, 300);
        }
    };


    /* =====================================================
       ERSTER START
       ===================================================== */

    try {

        recognition.start();

    } catch (e) {

        logToConsole(
            "❌ STARTFEHLER: " +
            e.message
        );
    }
}


/* =========================================================
   NOT-AUS
   ========================================================= */

let exitTimer = null;


document
    .getElementById("emergency-exit")
    .addEventListener("touchstart", () => {

        exitTimer =
            setTimeout(() => {

                location.reload();

            }, 3000);
    });


document
    .getElementById("emergency-exit")
    .addEventListener("touchend", () => {

        clearTimeout(exitTimer);
    });


</script>

</body>
</html>

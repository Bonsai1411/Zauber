<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Master</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: 'Courier New', monospace;
    }
    #emergency-exit {
        position: fixed;
        top: 0;
        left: 0;
        width: 25%;
        height: 25%;
        z-index: 99999;
    }
    #show-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #000 !important;
        z-index: 99999;
        opacity: 0;
        transition: opacity 2.5s ease-in-out;
    }
    #show-screen.visible {
        opacity: 1 !important;
    }
    .magic-text {
        color: #fff !important;
        font-size: 24px;
        text-shadow: 0 0 10px rgba(255,255,255,0.4);
        margin: 15px 0;
        letter-spacing: 2px;
        text-align: center;
    }
    .magic-card {
        color: #e50914 !important;
        font-size: 52px;
        font-weight: bold;
        text-shadow: 0 0 25px rgba(229,9,20,0.8);
        margin-top: 30px;
        letter-spacing: 4px;
    }
    .black-card {
        color: #fff !important;
        text-shadow: 0 0 25px rgba(255,255,255,0.8);
    }
</style>
</head>
<body>

<div id="emergency-exit"></div>

<div id="show-screen">
    <div class="magic-text" id="res-name">Zuschauer: --</div>
    <div class="magic-text" id="res-datum">Datum: --</div>
    <div class="magic-text magic-card" id="res-karte">♣♠♥♦</div>
    <div class="magic-text" id="res-geburtstag" style="color: #ffd700 !important; font-weight: bold; margin-top: 25px;"></div>
</div>

<script>
let phase = 0;
let kartenFarbe = "";
let kartenWert = 0;
let zuschauerName = "";
let geburtsTag = null;
let geburtsMonat = null;
let geburtsDatum = "";
let istGeburtstag = false;

const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;

const deutscheZahlen = {
    "null": 0, "eins": 1, "ein": 1, "zwei": 2, "drei": 3, "vier": 4, "fünf": 5, "funf": 5, "sechs": 6, "sieben": 7, "acht": 8, "neun": 9,
    "zehn": 10, "elf": 11, "zwölf": 12, "zwolf": 12, "dreizehn": 13, "vierzehn": 14, "fünfzehn": 15, "funfzehn": 15, "sechzehn": 16, "siebzehn": 17, "achtzehn": 18, "neunzehn": 19,
    "zwanzig": 20, "einundzwanzig": 21, "zweiundzwanzig": 22, "dreiundzwanzig": 23, "vierundzwanzig": 24, "fünfundzwanzig": 25, "funfundzwanzig": 25, "sechsundzwanzig": 26, "siebenundzwanzig": 27, "achtundzwanzig": 28, "neunundzwanzig": 29,
    "dreißig": 30, "dreissig": 30, "einunddreißig": 31, "einunddreissig": 31
};

function findeZahlen(text) {
    let zahlen = [];
    let gesaeubert = text.replace(/\./g, " ");
    const mitZiffern = gesaeubert.match(/\d+/g);
    if (mitZiffern) {
        for (const zahl of mitZiffern) {
            const wert = parseInt(zahl, 10);
            if (!isNaN(wert)) { zahlen.push(wert); }
        }
    }
    const woerter = gesaeubert.toLowerCase().replace(/[.,!?;:]/g, " ").split(/\s+/).filter(Boolean);
    for (const wort of woerter) {
        if (Object.prototype.hasOwnProperty.call(deutscheZahlen, wort)) {
            zahlen.push(deutscheZahlen[wort]);
        }
    }
    return zahlen;
}

function verarbeiteCodewoerter(text) {
    if (text.includes("händen") || text.includes("haenden")) { kartenWert += 10; }
    if (text.includes("einmal")) { kartenWert += 1; }
    if (text.includes("zweimal")) { kartenWert += 2; }
    if (text.includes("dreimal")) { kartenWert += 3; }
    if (text.includes("viermal")) { kartenWert += 4; }
    if (!text.includes("händen") && !text.includes("haenden") && text.includes("hand")) { kartenWert += 5; }
}
if (!SpeechRecognition) {
    alert("Fehler: Browser unterstützt SpeechRecognition nicht.");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = "de-DE";
    recognition.continuous = false; 
    recognition.interimResults = false;

    recognition.onerror = (event) => {
        if ((event.error === 'no-speech' || event.error === 'aborted') && phase < 4) {
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 300);
        }
    };

    recognition.onresult = (event) => {
        let letzterIndex = event.results.length - 1;
        let result = event.results[letzterIndex];
        if (!result || !result[0]) { return; }
        
        let roherText = result[0].transcript;
        if (!roherText) { return; }
        roherText = roherText.toLowerCase().trim();

        let text = roherText
            .replace(/ein\s+mal/g, "einmal")
            .replace(/zwei\s+mal/g, "zweimal")
            .replace(/drei\s+mal/g, "dreimal")
            .replace(/vier\s+mal/g, "viermal")
            .replace(/fünf\s+mal/g, "viermal")
            .replace(/reihem\s+folge/g, "reihenfolge")
            .replace(/reihen\s+folge/g, "reihenfolge")
            .replace(/kartendeckt/g, "reihenfolge")   
            .replace(/deckels/g, "reihenfolge")       
            .replace(/beachte/g, "14")                
            .replace(/achte/g, "8")                   
            .replace(/ranz/g, "franz")
            .replace(/wolf/g, "12")
            .replace(/dein\s+datum/g, "dein datum");

        verarbeiteSprache(text);
    };
    function verarbeiteSprache(text) {
        /* PRIORITY 1: DER ABSOLUTE BÜHNEN-NOT-AUSSTIEG GANZ OBEN */
        if (phase === 3) {
            if (text.includes("verdeckt") || text.includes("verdeck") || text.includes("fertig") || text.includes("ende") || text.includes("schluss")) {
                phase = 4;

                const heute = new Date();
                istGeburtstag = geburtsTag === heute.getDate() && geburtsMonat === (heute.getMonth() + 1);

                let finalerWertName = kartenWert;
                if (kartenWert === 1 || kartenWert === 14 || kartenWert === 0) finalerWertName = "Ass";
                else if (kartenWert === 11) finalerWertName = "Bube";
                else if (kartenWert === 12) finalerWertName = "Dame";
                else if (kartenWert === 13) finalerWertName = "König";

                document.getElementById("res-name").innerHTML = "Zuschauer: " + (zuschauerName || "(Gedankenübertragung aktiv)");
                document.getElementById("res-datum").innerHTML = "Datum: " + (geburtsDatum || "(Mysterium)");
                
                let kartenAnzeige = document.getElementById("res-karte");
                kartenAnzeige.innerHTML = kartenFarbe + " " + finalerWertName;
                
                if (kartenFarbe.includes("Pik") || kartenFarbe.includes("Kreuz")) {
                    kartenAnzeige.classList.add("black-card");
                }

                if (istGeburtstag) {
                    document.getElementById("res-geburtstag").innerHTML = "Alles Gute zum Geburtstag! 🎂✨";
                }

                document.getElementById("show-screen").classList.add("visible");
                
                try { recognition.stop(); } catch(e) {}
                return;
            }
        }

        /* PHASE 0 & 1 VERSCHMOLZEN: DAS DURCHZÜND-RELAIS */
        if (phase === 0 || phase === 1) {
            if (phase === 0 && text.includes("zusammen")) { phase = 1; }
            
            if (phase === 1) {
                let farbeGefunden = false;
                if (text.includes("passiert")) { kartenFarbe = "Pik ♠"; farbeGefunden = true; }
                else if (text.includes("geschehen")) { kartenFarbe = "Herz ♥"; farbeGefunden = true; }
                else if (text.includes("gewesen")) { kartenFarbe = "Kreuz ♣"; farbeGefunden = true; }
                else if (text.includes("gehabt")) { kartenFarbe = "Karo ♦"; farbeGefunden = true; }

                if (farbeGefunden) {
                    phase = 2;
                    verarbeiteCodewoerter(text);
                    return;
                }
            }
            return;
        }

        /* PHASE 2: CODEWÖRTER */
        if (phase === 2) {
            if (text.includes("reihenfolge")) {
                verarbeiteCodewoerter(text);
                phase = 3;
                return;
            }
            verarbeiteCodewoerter(text);
            return;
        }

        /* PHASE 3: NAME + DATUM */
        if (phase === 3) {
            const datumPosition = text.indexOf("dein datum");
            if (datumPosition > 0 && zuschauerName === "") {
                let nameTeil = text.substring(0, datumPosition).trim();
                nameTeil = nameTeil.replace(/^[,.:;!? ]+|[,.:;!? ]+\$/g, "");
                if (nameTeil.toLowerCase() !== "name" && nameTeil !== "") {
                    zuschauerName = nameTeil.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
                }
            }

            if (text.includes("heute") || text.includes("ist heute") || text.includes("ist also heute")) {
                if (geburtsTag === null) {
                    const echtzeitUhr = new Date();
                    geburtsTag = echtzeitUhr.getDate();
                    geburtsMonat = echtzeitUhr.getMonth() + 1;
                    geburtsDatum = String(geburtsTag).padStart(2, "0") + "." + String(geburtsMonat).padStart(2, "0");
                }
            }

            const alsoPosition = text.indexOf("also");
            if (alsoPosition !== -1 && geburtsTag === null) {
                const nachAlso = text.substring(alsoPosition + 4).trim();
                const zahlen = findeZahlen(nachAlso);
                if (zahlen.length >= 2) {
                    geburtsTag = zahlen[0];
                    geburtsMonat = zahlen[1];
                    geburtsDatum = String(geburtsTag).padStart(2, "0") + "." + String(geburtsMonat).padStart(2, "0");
                }
            }
            return;
        }
    }

    /* GESTERNS UNZAPPLIGER GEÖLTER SCHRANKEN-RESTART */
    let neustartTimer = null;
    let antiLoopSperre = false;

    recognition.onend = () => {
        if (phase < 4) {
            if (antiLoopSperre) { return; }
            antiLoopSperre = true;
            if (neustartTimer) { clearTimeout(neustartTimer); }
            neustartTimer = setTimeout(() => {
                try {
                    recognition.start();
                    setTimeout(() => { antiLoopSperre = false; }, 1000);
                } catch (e) { antiLoopSperre = false; }
            }, 800); 
        }
    };

    /* 👉 DER ABSOLUTE SICHERHEITS-VERZÖGERER (ZÜNDET ERST NACH 500MS SAUBER) */
    setTimeout(() => {
        try { recognition.start(); } catch(e) {}
    }, 500);
}

/* NOT-AUS */
let exitTimer = null;
document.getElementById("emergency-exit").addEventListener("touchstart", () => { exitTimer = setTimeout(() => { location.reload(); }, 3000); });
document.getElementById("emergency-exit").addEventListener("touchend", () => { clearTimeout(exitTimer); });
</script>
</body>
</html>
